<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Traveloop Prototype</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      body{font-family: Arial, Helvetica, sans-serif; padding:20px}
      input, button {padding:8px; margin:4px}
      .trip {border:1px solid #ddd; padding:8px; margin:6px}
    </style>
  </head>
  <body>
    <h1>Traveloop — Prototype</h1>
    <div id="root">Loading...</div>

    <!-- React + ReactDOM from CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <script>
      const e = React.createElement;

      function App(){
        const [trips, setTrips] = React.useState([]);
        const [name, setName] = React.useState('');
        const [start, setStart] = React.useState('');
        const [end, setEnd] = React.useState('');

        React.useEffect(()=>{fetch('/api/trips').then(r=>r.json()).then(setTrips)}, []);

        const add = async ()=>{
          const res = await fetch('/api/trips',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,start,end})});
          if(res.status===201){
            const t = await res.json();
            setTrips(prev=>[...prev,t]);
            setName(''); setStart(''); setEnd('');
          }
        }

        return e('div',null,
          e('div',null,
            e('input',{placeholder:'Trip name',value:name,onChange:e=>setName(e.target.value)}),
            e('input',{type:'date',value:start,onChange:e=>setStart(e.target.value)}),
            e('input',{type:'date',value:end,onChange:e=>setEnd(e.target.value)}),
            e('button',{onClick:add},'Add Trip')
          ),
          e('h2',null,'My Trips'),
          e('div',null, trips.map(t=> e('div',{key:t.id,className:'trip'},
            e('strong',null,t.name), e('div',null, (t.start || '') + ' → ' + (t.end || ''))
          )))
        )
      }

      ReactDOM.createRoot(document.getElementById('root')).render(e(App));
    </script>
  </body>
</html>
